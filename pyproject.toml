[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpie"
version = "0.1.0"
description = "The standing-order pizza button: an MCP server that orders your usual Domino's. Cash at pickup, hard confirmation gate, no card data ever."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "SuperAngryMonkey" }]
keywords = ["mcp", "model-context-protocol", "dominos", "pizza", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
]
dependencies = [
    "mcp>=1.2,<2",
    "pizzapi>=0.0.5",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/SuperAngryMonkey/mcpie"
Issues = "https://github.com/SuperAngryMonkey/mcpie/issues"

[project.scripts]
mcpie = "mcpie.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpie"]
